<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17130c">
<link rel="manifest" href="./manifest.json">

<title>Mister Emis - Controle de Fermentação</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#0d0d0d;
 color:#f5f5f5;
 font-family:Arial,sans-serif
}

header{
 background:#17130c;
 border-bottom:3px solid #e5a91c;
 padding:22px 20px
}

.brand{
 display:flex;
 align-items:center;
 gap:15px;
 max-width:900px;
 margin:auto
}

.logo{
 width:105px;
 height:105px;
 object-fit:contain;
 border-radius:18px
}

.brand-title{
 color:#f0b323;
 font-size:30px;
 font-weight:800
}

.brand-sub{
 font-size:18px;
 margin-top:5px
}

main{
 max-width:900px;
 margin:auto;
 padding:20px
}

.card{
 background:#1b1b1b;
 border-radius:22px;
 padding:24px;
 margin-bottom:20px
}

h3{
 font-size:25px;
 margin:0 0 20px
}

input,select,textarea{
 width:100%;
 background:#101010;
 border:1px solid #444;
 color:white;
 padding:16px;
 border-radius:12px;
 font-size:18px;
 margin-bottom:14px
}

textarea{
 min-height:80px
}

button{
 border:0;
 border-radius:10px;
 padding:14px 18px;
 font-size:17px;
 font-weight:bold;
 cursor:pointer
}

.btn{
 background:#f0b323;
 color:#111
}

.edit{
 background:#444;
 color:white
}

.delete{
 background:#842d30;
 color:white
}

.actions{
 display:flex;
 gap:10px;
 flex-wrap:wrap
}

.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}

.result{
 font-size:18px;
 line-height:1.6
}

.good{
 color:#6fdc8c;
 font-weight:bold
}

.warn{
 color:#ffcc55;
 font-weight:bold
}

table{
 width:100%;
 border-collapse:collapse;
 min-width:650px
}

th,td{
 border-bottom:1px solid #444;
 padding:10px;
 text-align:left
}

.tablebox{
 overflow-x:auto
}

canvas{
 background:#111;
 border-radius:12px;
 width:100%;
 max-height:300px
}

@media(max-width:600px){
 .grid{grid-template-columns:1fr}
 .logo{width:100px;height:100px}
 .brand-title{font-size:27px}
 main{padding:15px}
 .card{padding:20px}
}
</style>
</head>

<body>

<header>
 <div class="brand">
  <img src="./logo.png" class="logo" alt="Logo Mister Emis">
  <div>
   <div class="brand-title">MISTER EMIS</div>
   <div class="brand-sub">Controle de Fermentação • V4</div>
  </div>
 </div>
</header>

<main>

<div class="card">
<h3>🍺 Receitas / lotes</h3>

<select id="lista" onchange="selecionar()">
<option value="">Selecione...</option>
</select>

<div class="actions">
<button class="btn" onclick="nova()">+ Nova</button>
<button class="edit" onclick="editar()">Editar</button>
<button class="delete" onclick="excluir()">Excluir</button>
</div>
</div>


<div class="card">
<h3>Cadastro da receita</h3>

<input id="nome" placeholder="Nome do lote">
<input id="estilo" placeholder="Estilo da cerveja">
<input id="ferm" placeholder="Fermentador">
<input id="vol" type="number" step="0.1" placeholder="Volume L">
<input id="bi" type="number" step="0.1" placeholder="Brix inicial">

<button class="btn" onclick="salvar()">Salvar receita</button>
</div>


<div class="card">
<h3 id="titulo">Medição — nenhum lote</h3>

<div class="grid">

<div>
<label>Data</label>
<input id="data" type="date">
</div>

<div>
<label>Brix atual</label>
<input id="brix" type="number" step="0.1">
</div>

<div>
<label>Temperatura °C</label>
<input id="temp" type="number" step="0.1">
</div>

<div>
<label>Pressão (bar)</label>
<input id="pressao" type="number" step="0.1">
</div>

</div>

<textarea id="obs" placeholder="Observações"></textarea>

<button class="btn" onclick="medir()">Registrar medição</button>
</div>


<div class="card">
<h3>📊 Resumo automático</h3>
<div id="resumo" class="result">
Selecione um lote e registre as medições.
</div>
</div>


<div class="card">
<h3>📈 Gráfico de Brix</h3>
<canvas id="graf" width="800" height="300"></canvas>
</div>


<div class="card">
<h3>📋 Histórico</h3>

<div class="tablebox">
<table>
<thead>
<tr>
<th>Data</th>
<th>Brix</th>
<th>°C</th>
<th>Bar</th>
<th>Observação</th>
</tr>
</thead>
<tbody id="historico"></tbody>
</table>
</div>

<br>

<button class="edit" onclick="exportar()">Exportar CSV</button>

</div>

</main>


<script>

const STORAGE="MISTER_EMIS_V4";

let db=JSON.parse(localStorage.getItem(STORAGE)) || {
 receitas:[],
 ativa:""
};

function gravar(){
 localStorage.setItem(STORAGE,JSON.stringify(db));
}

function atual(){
 return db.receitas.find(r=>r.id===db.ativa);
}

function nova(){
 db.ativa="";
 document.getElementById("lista").value="";
 limparCadastro();
 render();
}

function limparCadastro(){
 ["nome","estilo","ferm","vol","bi"].forEach(id=>{
  document.getElementById(id).value="";
 });
}

function salvar(){

 let nome=document.getElementById("nome").value.trim();
 let bi=parseFloat(document.getElementById("bi").value);

 if(!nome){
  alert("Digite o nome do lote.");
  return;
 }

 if(isNaN(bi)){
  alert("Digite o Brix inicial.");
  return;
 }

 let existente=atual();

 if(existente){

  existente.nome=nome;
  existente.estilo=document.getElementById("estilo").value;
  existente.ferm=document.getElementById("ferm").value;
  existente.vol=document.getElementById("vol").value;
  existente.bi=bi;

 }else{

  let receita={
   id:Date.now().toString(),
   nome:nome,
   estilo:document.getElementById("estilo").value,
   ferm:document.getElementById("ferm").value,
   vol:document.getElementById("vol").value,
   bi:bi,
   med:[]
  };

  db.receitas.push(receita);
  db.ativa=receita.id;
 }

 gravar();
 render();

 alert("Receita salva!");
}

function selecionar(){
 db.ativa=document.getElementById("lista").value;
 gravar();
 render();
}

function editar(){

 let r=atual();

 if(!r){
  alert("Selecione um lote.");
  return;
 }

 document.getElementById("nome").value=r.nome;
 document.getElementById("estilo").value=r.estilo || "";
 document.getElementById("ferm").value=r.ferm || "";
 document.getElementById("vol").value=r.vol || "";
 document.getElementById("bi").value=r.bi || "";
}

function excluir(){

 let r=atual();

 if(!r){
  alert("Selecione um lote.");
  return;
 }

 if(confirm("Excluir o lote "+r.nome+"?")){

  db.receitas=db.receitas.filter(x=>x.id!==r.id);
  db.ativa="";

  gravar();
  render();
 }
}


/* Conversão Brix -> SG */

function sgBrix(b){
 return 1+(b/(258.6-((b/258.2)*227.1)));
}


/* Correção aproximada do refratômetro
   durante fermentação */

function corrigida(obi,fb){

 let og=sgBrix(obi);

 return 1.001843
 -0.002318474*obi
 -0.000007775*obi*obi
 -0.000000034*obi*obi*obi
 +0.00574*fb
 +0.00003344*fb*fb
 +0.000000086*fb*fb*fb;
}


function calcular(r,m){

 let og=sgBrix(parseFloat(r.bi));
 let fg=corrigida(parseFloat(r.bi),parseFloat(m.brix));

 let atenuacao=((og-fg)/(og-1))*100;
 let abv=(og-fg)*131.25;

 return{
  og:og,
  fg:fg,
  atenuacao:atenuacao,
  abv:abv
 };
}


function medir(){

 let r=atual();

 if(!r){
  alert("Selecione um lote primeiro.");
  return;
 }

 let b=parseFloat(document.getElementById("brix").value);

 if(isNaN(b)){
  alert("Digite o Brix atual.");
  return;
 }

 let m={
  data:document.getElementById("data").value,
  brix:b,
  temp:document.getElementById("temp").value,
  pressao:document.getElementById("pressao").value,
  obs:document.getElementById("obs").value
 };

 r.med.push(m);

 gravar();

 document.getElementById("brix").value="";
 document.getElementById("temp").value="";
 document.getElementById("pressao").value="";
 document.getElementById("obs").value="";

 render();
}


function statusFermentacao(r){

 if(!r.med || r.med.length===0){
  return "Aguardando primeira medição.";
 }

 let ultima=r.med[r.med.length-1];

 let texto="";

 if(r.med.length>=3){

  let a=r.med[r.med.length-1].brix;
  let b=r.med[r.med.length-2].brix;
  let c=r.med[r.med.length-3].brix;

  if(Math.abs(a-b)<=0.2 && Math.abs(b-c)<=0.2){
   texto="Brix praticamente estável nas últimas medições.";
  }else{
   texto="Fermentação em andamento — Brix continua variando.";
  }

 }else{
  texto="Continue registrando medições para avaliar a tendência.";
 }

 let calc=calcular(r,ultima);

 return `
 Brix inicial: <b>${r.bi}</b><br>
 Brix atual: <b>${ultima.brix}</b><br>
 SG inicial estimada: <b>${calc.og.toFixed(3)}</b><br>
 FG corrigida estimada: <b>${calc.fg.toFixed(3)}</b><br>
 Atenuação aparente estimada: <b>${calc.atenuacao.toFixed(1)}%</b><br>
 Álcool estimado: <b>${calc.abv.toFixed(1)}%</b><br><br>
 <span class="warn">${texto}</span><br><br>
 <small>
 O refratômetro precisa de correção após o início da fermentação.
 Confirme a densidade final com densímetro quando possível.
 </small>
 `;
}


function grafico(r){

 let cv=document.getElementById("graf");
 let ctx=cv.getContext("2d");

 ctx.clearRect(0,0,cv.width,cv.height);

 ctx.fillStyle="#111";
 ctx.fillRect(0,0,cv.width,cv.height);

 if(!r || !r.med || r.med.length===0){
  return;
 }

 let dados=r.med.map(m=>parseFloat(m.brix));

 let max=Math.max(parseFloat(r.bi),...dados)+1;
 let min=Math.min(...dados)-1;

 let margem=45;

 let largura=cv.width-margem*2;
 let altura=cv.height-margem*2;

 ctx.strokeStyle="#555";
 ctx.lineWidth=1;

 ctx.beginPath();
 ctx.moveTo(margem,margem);
 ctx.lineTo(margem,cv.height-margem);
 ctx.lineTo(cv.width-margem,cv.height-margem);
 ctx.stroke();

 ctx.strokeStyle="#f0b323";
 ctx.lineWidth=4;
 ctx.beginPath();

 dados.forEach((v,i)=>{

  let x=margem;

  if(dados.length>1){
   x=margem+(i*(largura/(dados.length-1)));
  }

  let y=margem+((max-v)/(max-min))*altura;

  if(i===0){
   ctx.moveTo(x,y);
  }else{
   ctx.lineTo(x,y);
  }
 });

 ctx.stroke();

 ctx.fillStyle="#f0b323";

 dados.forEach((v,i)=>{

  let x=margem;

  if(dados.length>1){
   x=margem+(i*(largura/(dados.length-1)));
  }

  let y=margem+((max-v)/(max-min))*altura;

  ctx.beginPath();
  ctx.arc(x,y,6,0,Math.PI*2);
  ctx.fill();
 });
}


function render(){

 let lista=document.getElementById("lista");

 lista.innerHTML='<option value="">Selecione...</option>';

 db.receitas.forEach(r=>{

  let o=document.createElement("option");

  o.value=r.id;
  o.textContent=r.nome;

  lista.appendChild(o);
 });

 lista.value=db.ativa || "";

 let r=atual();

 document.getElementById("titulo").textContent=
 r ? "Medição — "+r.nome : "Medição — nenhum lote";

 if(!r){

  document.getElementById("historico").innerHTML="";
  document.getElementById("resumo").innerHTML=
  "Selecione um lote e registre as medições.";

  grafico(null);
  return;
 }

 document.getElementById("resumo").innerHTML=statusFermentacao(r);

 let html="";

 (r.med || []).slice().reverse().forEach(m=>{

  html+=`
  <tr>
   <td>${m.data || "-"}</td>
   <td>${m.brix}</td>
   <td>${m.temp || "-"}</td>
   <td>${m.pressao || "-"}</td>
   <td>${m.obs || "-"}</td>
  </tr>
  `;
 });

 document.getElementById("historico").innerHTML=html;

 grafico(r);
}


function exportar(){

 let r=atual();

 if(!r){
  alert("Selecione um lote.");
  return;
 }

 let linhas=[
  ["Data","Brix","Temperatura","Pressao","Observacao"]
 ];

 (r.med || []).forEach(m=>{
  linhas.push([
   m.data,
   m.brix,
   m.temp,
   m.pressao,
   m.obs
  ]);
 });

 let csv=linhas.map(l=>
  l.map(v=>`"${String(v ?? "").replace(/"/g,'""')}"`).join(";")
 ).join("\n");

 let blob=new Blob([csv],{
  type:"text/csv;charset=utf-8"
 });

 let url=URL.createObjectURL(blob);

 let a=document.createElement("a");

 a.href=url;
 a.download=r.nome.replace(/\s+/g,"_")+"_fermentacao.csv";

 a.click();

 URL.revokeObjectURL(url);
}


document.getElementById("data").value=
 new Date().toISOString().slice(0,10);

render();


if("serviceWorker" in navigator){

 window.addEventListener("load",()=>{

  navigator.serviceWorker
   .register("./sw.js")
   .catch(console.error);

 });
}

</script>

</body>
</html>
